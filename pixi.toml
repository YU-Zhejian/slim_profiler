# Some names were specified in pyproject.toml.
[workspace]
channels = ["conda-forge"]
name = "slim_profiler"
platforms = ["linux-64", { name = "cuda-linux-64", platform = "linux-64", cuda = "12.0" }]

[tasks]

[environments]
gpu-stress = { features = ["gpu-stress"] }
# The cuda-linux-64 platform is declared workspace-wide, so it is inherited by every
# feature by default. Pin the non-GPU environments back to plain linux-64 so only
# gpu-stress solves against __cuda.
default = { features = [], platforms = ["linux-64"] }
build = { features = ["build"], platforms = ["linux-64"] }
fmt = { features = ["fmt"] , no-default-feature = true, platforms = ["linux-64"] }

[dependencies]
python = "3.13.*"
psutil = ">=7.2.2,<8"
numpy = ">=2.5.2,<3"
matplotlib-base = ">=3.11.1,<4"
pyright = ">=1.1.411,<2"
polars = ">=1.43.2,<2"
stress-ng = ">=0.17.3,<0.18"

[feature.gpu-stress]
platforms = ["cuda-linux-64"]

[feature.gpu-stress.dependencies]
nvidia-ml-py = ">=13.610.43,<14"
cuda-version = ">=12.9,<13"
cupy = ">=14.2.0,<15"

[feature.build.dependencies]
python-build = ">=1.5.0,<2"
twine = ">=7.0.0,<8"

[feature.fmt.dependencies]
black = ">=26.5.1,<27"
